[project]
name = "archimedes2026"
version = "0.1.0"
description = "Enterprise B2B ICP Discovery & Lookalike Recommendation Engine for Greek Businesses"
readme = "README.md"
authors = [
    { name = "MariosCodes", email = "104013314+MariosCodes@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pytest>=8.0.0",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
archimedes2026 = "app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "deliverables: marks baseline deliverable snapshot tests",
    "api: marks Starlette API client tests",
    "engine: marks mathematical engine tests",
    "ingest: marks data ingestion tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "."]
exclude = [
    ".git",
    ".venv",
    "output",
    "data",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (formatter takes precedence)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict=
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
