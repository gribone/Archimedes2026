<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for Search Lens & AI Badge -->
    <linearGradient id="logoLensBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="logoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Cookie Dough Gradient -->
    <radialGradient id="logoCookie" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#F6C886" />
      <stop offset="65%" stop-color="#D99343" />
      <stop offset="100%" stop-color="#B06821" />
    </radialGradient>

    <!-- Glass Interior Tint -->
    <radialGradient id="logoGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="85%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#93C5FD" />
    </radialGradient>

    <!-- Soft Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= ICON MARK (LEFT) ================= -->
  <g transform="translate(25, 12) scale(0.58)" filter="url(#logoShadow)">
    <!-- Handle -->
    <g transform="rotate(-45 220 220)">
      <rect x="196" y="370" width="48" height="32" rx="8" fill="url(#logoCyan)" />
      <rect x="188" y="394" width="64" height="145" rx="32" fill="url(#logoLensBlue)" />
      <rect x="200" y="408" width="12" height="110" rx="6" fill="#FFFFFF" opacity="0.25" />
    </g>

    <!-- Lens Backdrop -->
    <circle cx="220" cy="220" r="156" fill="url(#logoGlass)" />

    <!-- Cookie Body -->
    <path d="M 220,98 
             C 242,96 258,104 278,114 
             C 298,124 318,136 328,156 
             C 338,176 344,198 342,220 
             C 344,242 336,264 326,284 
             C 316,304 298,320 278,330 
             C 258,340 242,344 220,342 
             C 198,344 176,338 156,328 
             C 136,318 120,302 110,282 
             C 100,262 96,242 98,220 
             C 96,198 104,176 114,156 
             C 124,136 140,120 160,110 
             C 180,100 198,96 220,98 Z" fill="url(#logoCookie)" stroke="#9C5718" stroke-width="5" />

    <!-- Chocolate Chips -->
    <ellipse cx="165" cy="142" rx="16" ry="13" transform="rotate(-20 165 142)" fill="#4A2511" />
    <ellipse cx="268" cy="138" rx="14" ry="17" transform="rotate(25 268 138)" fill="#3D1E0D" />
    <circle cx="216" cy="122" r="10" fill="#4A2511" />
    <ellipse cx="125" cy="198" rx="12" ry="15" transform="rotate(12 125 198)" fill="#3D1E0D" />
    <ellipse cx="314" cy="202" rx="14" ry="11" transform="rotate(-15 314 202)" fill="#4A2511" />
    <ellipse cx="152" cy="288" rx="17" ry="13" transform="rotate(30 152 288)" fill="#4A2511" />
    <ellipse cx="282" cy="292" rx="15" ry="13" transform="rotate(-25 282 292)" fill="#3D1E0D" />
    <circle cx="218" cy="314" r="11" fill="#4A2511" />

    <!-- Cute Face -->
    <ellipse cx="150" cy="238" rx="16" ry="10" fill="#F43F5E" opacity="0.55" />
    <ellipse cx="290" cy="238" rx="16" ry="10" fill="#F43F5E" opacity="0.55" />

    <!-- Eyes -->
    <circle cx="174" cy="212" r="17" fill="#271206" />
    <circle cx="168" cy="205" r="6.5" fill="#FFFFFF" />
    <circle cx="180" cy="218" r="3" fill="#FFFFFF" />

    <circle cx="266" cy="212" r="17" fill="#271206" />
    <circle cx="260" cy="205" r="6.5" fill="#FFFFFF" />
    <circle cx="272" cy="218" r="3" fill="#FFFFFF" />

    <!-- Smile -->
    <path d="M 196,232 Q 220,258 244,232" fill="none" stroke="#271206" stroke-width="8" stroke-linecap="round" />

    <!-- Glass Reflection & Rim -->
    <path d="M 118,155 A 122,122 0 0,1 245,98" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.75" />
    <circle cx="220" cy="220" r="158" fill="none" stroke="url(#logoLensBlue)" stroke-width="34" />
    <circle cx="220" cy="220" r="141" fill="none" stroke="#BAE6FD" stroke-width="3" opacity="0.75" />

    <!-- AI Sparkle -->
    <path d="M 355,65 Q 355,95 385,95 Q 355,95 355,125 Q 355,95 325,95 Q 355,95 355,65 Z" fill="url(#logoCyan)" />
  </g>

  <!-- ================= BRAND TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(345, 14)">
    <!-- "Bizcover" Main Wordmark ("Biz" in #0F172A, "cover" in #FFFFFF) -->
    <text x="0" y="182" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2.5" fill="#0F172A">
      Biz<tspan fill="#FFFFFF">cover</tspan>
    </text>

    <!-- "AI" Pill Badge -->
    <g transform="translate(432, 98)">
      <rect x="0" y="0" width="118" height="96" rx="24" fill="url(#logoLensBlue)" filter="url(#logoShadow)" />
      <text x="59" y="67" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#FFFFFF">
        AI
      </text>
      <!-- Little Sparkle on AI Badge -->
      <path d="M 102,12 Q 102,22 112,22 Q 102,22 102,32 Q 102,22 92,22 Q 102,22 102,12 Z" fill="#67E8F9" />
    </g>
  </g>
</svg>